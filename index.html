# Digital Product Leadership - API Platform
## Document 0: Context, scope, and fact base

> **Author:** Irlan Lima, Technical Product Manager (Technical Platforms · APIs · Banking & Fintech).
> **Program:** Digital Product Leadership
> **Confidentiality:** I do not name the institution. I treat it as *"a large bank."*

### Lessons drawn from

**Companies:** Airbnb, Airtable, Amazon, Coinbase, DoorDash, Google, Linear, LinkedIn, Palantir, Pixar.

**People:** Marty Cagan, Shreyas Doshi, Lenny Rachitsky, Teresa Torres, Roger Martin, Annie Duke, Jeff Patton, Nicole Forsgren, Ravi Mehta, Tomer Cohen, Anuj Rathi, Skelton, Pais, Humble, Kim, Reinertsen, plus Heifetz, Lencioni, Bezos, Fogg, and Garrett.

---

### 1. The central thesis (what this case actually argues)

This is not, at its core, a case about APIs. It is a case about **platform**.

> **Thesis:** a **well-built horizontal platform accelerates the launch of digital product verticals.** When the company turns a repeated capability (exposing and consuming APIs) into an internal product with self-service, enablement, and governance built in, every business team ships faster, with less risk, and without depending on a central bottleneck.

APIs are only the **vehicle** of the thesis. The mechanism of **enablement + self-service + federated governance** is the same one that sustains a *design system*, a *data platform*, an *internal developer platform*, or a *payments platform*. That is why, across the documents, every block has a **generalization layer**: how the same reasoning applies to any horizontal platform in a large company.

The antagonist of the story is familiar: the **centralized API Gateway that became a bottleneck**. The protagonist is the **federated model with domain ownership**, which returns autonomy without giving up governance and security.

---

### 2. The case arc in 5 sentences (the "elevator" before any slide)

1. **Problem:** the central API team became a bottleneck. Every new exposure depended on a single queue, and that was already slowing down tens of thousands of APIs and thousands of developers.
2. **Why now:** 63% of product acquisitions already came from digital channels, and Open Finance/PIX added non-negotiable regulatory deadlines; scaling exposure became a prerequisite for revenue.
3. **Decision:** federate governance (domain ownership + automated guardrails) instead of reinforcing the center or buying a market SaaS.
4. **How we validate:** a reversible pilot by domain, measuring lead time, incidents, and, above all, **reuse** of the published APIs.
5. **Result and next step:** self-service exposure with governance preserved; the metric that stays on the radar is not "how many APIs we published," but **how many APIs are actually reused**.

---

### 3. Fact base

**Facts (anonymized):**

- An ecosystem with **more than 30,000 APIs** of **four types**: private (between internal applications), restricted (partners/customers), regulatory (PIX, Open Finance, with design defined by the regulator), and public (open innovation / sandbox).
- **63% of product acquisitions** completed through digital channels (quarterly cut); **millions of new customers per quarter** (~8-9 million in a single quarter).
- Governance and exposure were **centralized**: a single gateway = a single point of failure, high management effort, knowledge restricted to one team.
- The real solution: **federated governance** with an **API owner per domain** (called *API Champion* here), **Contract First + DDD**, **OpenAPI**, a pipeline with automatic validations; **API Gateway** (north-south) / **Service Mesh** (east-west); REST/gRPC; Developer Portal + central catalog; **Transit/Shared/Outbound** accounts; **OAuth2/mTLS + guardrails**; observability without exposing sensitive data; **Terraform + GitLab + GitLab CI + CodePipeline/CodeBuild**; canary/blue-green deploy, throttling, and per-service monetization strategies.

**Scale and operating targets:**

- A scale trajectory toward **~30,000 APIs**; **−~70% in exposure lead time** (e.g., 20 → 6 business days); a base of **+10,000 developers** dependent on the platform; **50+ federated domains**; **SLA ≥ 99.95%**; RICE scores; a business-value anchor.

---

### 4. Reading conventions

Across the documents, I distinguish explicitly:

- **Observed fact:** what the sources support.
- **Hypothesis:** what we assume and need to validate.
- **Insight:** the non-obvious reading that connects the dots.
- **Product decision:** the choice that was made.
- **Strategic recommendation:** what would make the difference next.
- **Risk:** what can knock the thesis down.
- **Success metric:** how we would know it worked.

---

### 5. Generalization layer (the thread that runs through the whole case)

> Whenever you read "API" here, try swapping it for **"platform capability."** The central bottleneck, domain ownership, automated guardrails, the catalog, and the reuse metric describe the pattern of any **horizontal platform** that exists to accelerate the **product verticals** of a large company. That is why the case matters to someone who will never touch an API Gateway.

**References:** the author's career experience. The institution and internal sources are not named.

<script type="text/markdown" data-title="01 · The invisible platform">
# The invisible platform: how enablement, self-service, and federated governance accelerate the launch of digital products

*An API-scale case at a large company, and why the lessons hold for any platform.*

---

There is a kind of product that nobody sees and everybody uses. It has no pretty screen, it does not show up in a campaign, it does not win a design award. But when it fails, dozens of other products stop with it. And when it works well, entire teams start shipping faster without knowing exactly why.

It is the **horizontal platform**: the layer that product verticals consume in order to exist. A design system, a data platform, an internal payments system, an API catalog. This article is about one of those platforms, in an extreme context: a large, heavily regulated company, with **more than 15,000 APIs** active and thousands of developers dependent on them. But if you are never going to touch an API Gateway in your life, keep reading, because the thesis here is not about APIs. It is about a rule that repeats in any large company:

> **A well-built horizontal platform does not slow the verticals down with governance. It accelerates them, as long as it replaces central control with enablement, self-service, and federated governance.**

Let me tell you how I got there.

---

## The bottleneck nobody had the courage to admit

Start with the number that changes everything: in a recent window, **63% of this company's product acquisitions** happened through digital channels. It is not the app as a storefront. It is the app as the main sales counter. And behind every digital journey there are APIs: balance, card, payment, boleto generation, PIX, Open Finance. Thousands of them.

Now the problem. Every time a business team wanted to expose a new capability (a new API for a new product), it **depended on a single central governance team and a single gateway** through which all north-south traffic passed. At the beginning, that was a virtue: one place to guarantee standard, security, and control. At scale, it became the opposite.

The single gateway became a **single point of failure**: when it fell, it took several journeys down at the same time. The central team became a **queue**: every new exposure waited days, sometimes weeks, for a manual review. And knowledge became a **hostage**: only that team knew how to publish properly, which created dependence and endless tickets.

When you look at the typical distribution of the tickets that reached that team, the picture is clear: most of them were "how do I publish?", "how do I follow the contract standard?", "where is the documentation for this service?", "why did my new version break whoever was consuming me?". In other words: **they were not problems that required a central specialist. They were problems of enablement and of missing self-service.**

Here is the first product trap that almost every leader falls into, and that the Digital Product Leadership course hammers without stopping: confusing **symptom** with **cause**. The symptom was "low autonomy, a long queue, too many tickets." The temptation is to solve the symptom: hire more people for the central team, write more documentation, create one more committee. The structural cause, however, was something else:

> How do we scale the **publishing and consumption** of APIs without losing governance and security?

Reformulating the problem this way, from symptom to cause, is what separates an operational reaction from a strategic decision. And it was that reformulation that opened the door to the right solution.

---

## Why now: when the cost of waiting becomes visible

Product strategy is choice, and choice is only possible when there is a "why now." Three forces were pushing at the same time.

First, **digitalization was already reality, not a bet**: with most sales coming from digital, every week of lead time on an integration was delayed revenue. Second, **the regulator entered the field**: PIX and Open Finance arrived with non-negotiable deadlines and with the API design defined from the outside; you could not "prioritize it later." Third, **volume crossed a threshold**: managing thousands of APIs in a centralized model stopped being hard and became unviable.

When these three forces add up, the question stops being "is it worth changing the model?" and becomes "how much does it cost to stay as we are?". That inversion is the signal that a platform left the growth phase and entered the phase in which the initial structure becomes the ceiling. Recognizing that moment, not too early and not too late, is half the strategy.

---

## The decision: federate, do not reinforce (and do not buy)

Facing the bottleneck, there were three paths, and it is important to be honest about all of them:

**Reinforce the center.** More people, more capacity on the same gateway. Simple and familiar, but doomed, because it only pushes the same ceiling forward and keeps the single point of failure.

**Buy a market SaaS** for API management. Fast to start. But at a scale of tens of thousands of APIs, in a regulated sector that handles sensitive data, two criteria weigh more than time-to-value: **regulatory fit** and **scale without a single point of failure**. License cost grows non-linearly, isolation by domain is limited, and evolution stays stuck to a vendor's roadmap. Discarding this option in one sentence would be dishonest; evaluating it with weighted criteria showed that it loses exactly where it matters most.

**Build a federated model on our own cloud.** More complex to manage, with more accounts and more security surface. But it is the only path that solves the cause, not the symptom: **return exposure ownership to the domains**, keeping governance as code.

The choice was the third. And the name of this matters: **federated governance**. Each business line gained a new role, an API owner per domain, which I call an **API Champion** here, responsible for the lifecycle of their APIs, from design to production support. The central team stopped being the queue and became the **builder of the platform that enables the domains**.

Notice what happened: the **leadership** decision (who is in charge of what) and the **product** decision (what we build) became the same decision. It is the most underestimated point of the case. On a horizontal platform, the product is the instrument of a political agreement between people who want speed and people who want control. If you deliver only technology, the agreement does not happen.

---

## The three pillars that make the platform accelerate the verticals

The federated model stands on three pillars. They, and not gateway technology itself, are what turn a bottleneck platform into an accelerator.

### 1. Enablement: transfer the power together with the responsibility

It is useless to give a team responsibility for its APIs and not give it the tool or the knowledge to exercise it. That is what a discovery persona summarized better than any slide: *"They gave me responsibility for the domain, but not the tool to publish without asking permission."*

Enablement here is concrete: an **API Champion certification track**, templates that work the first time, playbooks, living documentation generated from the API contract itself. The objective is that the knowledge stuck in a central team spreads across the whole company, which the literature calls *inner source*. The platform does not scale by the number of people at the center; it scales by the number of teams able to manage on their own.

### 2. Self-service: make the right path the easy path

The second pillar is operational. The developer clones a template, configures their API, commits, and the pipeline takes care of the rest: it validates the contract, versions, publishes on the gateway, exposes the documentation on the portal, catalogs the service. From design to deploy, without opening a ticket.

The detail that makes the difference is behavioral. Behavioral design (Fogg's model: motivation + ability + trigger) says that behavior happens when the desired path is also the easiest. Well-done self-service does not ask the developer to "be disciplined"; it makes the governed path the path of least effort. Publishing the right way becomes easier than publishing the wrong way.

### 3. Federated governance: control without a human reviewer

This is where the legitimate fear of the people who take care of security lives: *"decentralizing scares me, because I will lose visibility when each team does it their own way."* The answer is not blind trust. It is a **guardrail**.

Guardrails are governance policies turned into code, applied automatically in **every** account in the organization. Mandatory use of OAuth2 and mTLS for external APIs, contract standards, observability without exposure of sensitive data: all of this stops being a manual review (which becomes a queue) and becomes an automatic gate (which does not become a queue). Governance is not loosened; it is **embedded**. Control stays centralized where it needs to be, in the policy, while execution is distributed.

It is the combination of the three that matters. Enablement without self-service is training that does not become practice. Self-service without governance is fast chaos. Governance without enablement is the queue again, with another name. Together, they produce the result that gives this article its title: **verticals that launch faster, with less risk, without a central bottleneck.**

---

## The metric almost everyone gets wrong

If I could leave a single metrics lesson, it would be this: **on a platform, do not measure supply. Measure consumption.**

The natural error is to celebrate "how many APIs we published in self-service." It looks like progress. But publishing is **output**; value is **outcome**. A platform full of APIs that nobody reuses is not success: it is debt with a good presentation. I called these "zombie APIs": alive in the catalog, dead in consumption.

That is why the case's North Star was not "APIs published." It was **"active reused APIs"**: APIs in production, with recurring consumption, by multiple consumers, within the SLA. It embeds three things at once: that the API is used (active), that it is used by more than one (reuse), and that it keeps being used (recurring).

And here comes the honest self-critique, the kind a review panel always looks for: almost everything you build first (certification, quality gates, portal) attacks **supply**, not reuse. Is that a contradiction? No, if it is deliberate. Supply is a prerequisite of reuse: there is no reused API that was not published well first. The rule that closes the hole is the pilot's success criterion: it is not enough for the team to publish alone (*single-player*); the real proof is the API being **consumed by at least one other domain** (*multi-player*). If publishing volume goes up and reuse does not follow, the decision is agreed in advance: **reprioritize consumption before pushing more supply.**

That is how the OKRs gained a KR that ties everything: besides reducing lead time, raising champion coverage, and protecting the SLA, an explicit key result of **reuse**, because, without it, the OKR would become a vanity metric dressed up as an outcome.

---

## What almost went wrong (and why agreeing on failure beforehand helps)

A technique that changed the way I work is the **pre-mortem**: before scaling, imagine we are already in the future, that everything failed, and list why. Not as pessimism, but to turn diffuse fear into an objective criterion.

The risks that showed up were concrete. Teams could create "shadow gateways" to bypass the guardrails, and the agreed response was: if more than a threshold of APIs escape the flow, the problem is the guardrail experience, not the developers. Security incidents could rise with distribution, and the rule was hard: any critical security incident freezes expansion. The API Champion itself could become the new bottleneck, only a local one, and the warning signal was lead time not dropping in the pilot. And, the most insidious, volume could grow without reuse growing with it.

The value of agreeing these **kill criteria beforehand** is that, in the heat of an incident or under regulatory pressure, you do not decide on impulse. You execute an agreement made in cold blood. A decision under pressure gets much better when the limits were already drawn.

---

## Why this holds for your platform, even if it has no APIs

Everything I described swaps the noun "API" for "platform capability" without losing the meaning. That is why the case matters to any product leader in a large company.

If you take care of a **design system**, your North Star is not "number of components published." It is the percentage of production screens built with the system. Your "shadow gateways" are the teams that recreate buttons on the outside because yours is hard to use. Your federated governance is lint rules and tokens that apply the standard without a human reviewer blocking every PR.

If you take care of a **data platform**, the bottleneck is the queue in the central BI team, enablement is enabling domains to produce their own trustworthy datasets, and reuse (datasets consumed by several squads) is what separates a living platform from a data swamp.

If you take care of an **internal developer platform**, the story is almost identical to this article: self-service with guardrails, golden paths, and the metric that matters is the time from commit to deploy, not the number of existing pipelines.

The pattern is always the same, and it is the real conclusion of the case:

> A horizontal platform does not generate its own revenue. It **shortens the verticals' path to revenue.** When you measure the platform by the speed and the reuse it unlocks in business teams, and not by the size of its own catalog, you stop building a pretty library and start building an accelerator.

And there is a leadership principle embedded in all of this. The temptation, in any large company, is to solve scale problems with more central control: more committees, more reviews, more people in the middle of the path. The counterintuitive move, and what this case argues, is that the way to **keep** governance at scale is to **distribute** execution and **centralize only the policy**, turned into code. You do not choose between autonomy and control. You design the mechanisms (enablement, self-service, guardrails) that deliver both at the same time.

---

## What I would take to the next platform

Three things stayed, and they are the ones I would repeat in any platform context:

**Reformulate the problem until you reach the cause.** "Too much queue" is not a product problem; "we cannot scale publishing without losing governance" is. The quality of your solution never exceeds the quality of your problem definition.

**Measure demand, not supply.** A full catalog is the metric that deceives. Reuse, recurring consumption, retention of whoever consumes: that is where a platform's value actually lives.

**Make the product the instrument of the agreement.** On a platform, the political decision and the product decision are the same. An API Champion is power with responsibility. A guardrail is control without a queue. A dashboard is trust through evidence. When the product materializes the agreement between speed and control, culture changes, not by speech, but by mechanism.

The platform stays invisible. Nobody is going to open the app and say "what beautiful federated governance." But the verticals will launch faster, the generalized incidents will disappear, and teams will publish on their own what used to wait in a queue. And that is, in the end, the best definition of success for a platform: **it disappears into everyone's workflow and leaves the company faster.**

---

*This text is a capstone case for the Digital Product Leadership program (Tera). For confidentiality, the institution is not named. The practices and strategies described are generalizable to any horizontal platform in a large company.*

<script type="text/markdown" data-title="02 · Fundamentals and strategy">
# Module 2: Product Management Fundamentals and Strategy
### Case: Horizontal API Platform (federated governance in the cloud)

## 2.1 PM fundamentals: the definition of product (Cagan)

**Framework.** A product is a tripod, not a list: it solves a **real problem**, it **creates/captures value**, and it is **technically feasible**. Missing one leg → it is a feature or an experiment. The biggest risk: the *build trap* (shipping a lot ≠ delivering value).

**Application.**
- **Problem:** business teams could not expose APIs at scale without depending on a central team that had become a bottleneck.
- **Value:** with 63% of acquisitions coming from digital channels, scaling exposure with governance **enables digital revenue, Open Finance, and PIX**.
- **Feasibility:** API Gateway, Service Mesh, Terraform, CI/CD, and OAuth2/mTLS a mature stack the company already masters.

**Senior reframe (fact → cause).** The visible symptom was "low autonomy / a queue in the central team." The **structural cause** was: *how do we scale publishing and exposure without losing governance and security?* Swapping the symptom for the cause is what separates a senior PM from a junior one exactly the antidote to the build trap. As Shreyas Doshi says (Lenny's), **"many execution problems are, in fact, strategy problems in disguise."** The "queue" was the execution symptom; what was missing was the strategic decision of *how to scale exposure without losing governance*.

> **Generalization layer.** The tripod holds for any internal platform: a *design system* is only a product if it solves the real pain of front-end teams (problem), reduces screen cost/time (value), and is adoptable without friction (feasibility). A platform with only one leg becomes an abandoned library.

## 2.2 Product people and empowered teams

**Framework.** A *feature team* receives features and is measured by **output**; an *empowered team* receives problems and is measured by **outcome**.

**Application.** The federated model is, in essence, a **thesis of empowered teams**: each domain receives the *problem* (expose its capabilities with quality) and answers for the *outcome* (reuse, SLA, lead time). The **API Champion** is the mechanism that transfers ownership from output (publishing) to outcome (being reused).

**The supply is the product (Airbnb, Lenny's).** At Airbnb, "the supply, meaning the hosts, is the product, not the technology." Here, the **producer domain / API Champion is the core**, not the gateway. Practical consequence for the roadmap: prioritize **tools that empower the producer** (track, templates, dashboards, API Score) before any infrastructure sophistication. Strong supply → more retained consumption (the North Star).

> **Generalization layer.** Every horizontal platform has "hosts": the teams that produce on top of it. If the platform treats those teams as passive users, it creates dependence; if it treats them as empowered producers, it scales. A good platform turns consumers into contributors (inner source).

## 2.3 Lifecycle

The ecosystem is in the **Growth → Maturity** transition: a documented base of 15,000+ APIs, with a trajectory toward ~30,000. Recognizing *which lifecycle phase the platform is in* is what justifies changing the model **now**, and not earlier, and it also changes which metrics are trustworthy:

| Phase | Signal on the platform | PM focus |
|---|---|---|
| Introduction | the central gateway worked well with few APIs | validate the exposure pattern |
| **Growth → Maturity (here)** | volume crosses the threshold; the single gateway becomes a bottleneck and a single point of failure | **federate: replace the structure that became the ceiling** |
| Full maturity | risk of "stacking features" on the platform and making DX worse | simplify; measure reuse, not volume |

**The typical maturity decision .** In maturity, the temptation is to load the platform with functionality, and that is when DX gets worse and domains flee to "shadow IT." Federation is the opposite move: **simplify the producer's path** (self-service with guardrails) instead of thickening the center. Federating is a lifecycle decision, not an aesthetic choice.

## 2.4 Product Sense

The "user" of this platform is not the bank's end customer. It is the **developer/squad** and the **API Champion**. Having *product sense* here means seeing the three needs in tension at the same time:

| Actor | What they want | If ignored… |
|---|---|---|
| Dev / squad | autonomy and speed to publish | resorts to a "shadow gateway" |
| Security / architecture | control, mTLS/OAuth2, visibility | vetoes and becomes a bottleneck |
| Business | scale without risk | loses digital time-to-market |

A good product here = **autonomy with guardrails**: the safe path is also the easiest. And product sense is **trained by exposure** (Lenny's, *exposure hours*): the platform PM who has never published an API through their own pipeline does not feel the friction the developer feels. That is why the platform team **dogfoods** the flow (see doc 04, 4.10).

## 2.5 What product strategy is

**Framework.** Vision ≠ Strategy ≠ Tactic. Strategy is **choice and renunciation**: "a strategy that does not say what we will *not* do is a wishlist." Operationally: **Context → Focus → Sequencing**. Five elements: Focus, Insights, Action, Management, Metrics.

**Application.**
- **Context:** central gateway = single point of failure and bottleneck; digitalization presses for more exposure.
- **Focus:** scale exposure **without losing governance**.
- **Sequencing:** (1) API Champion + OpenAPI + quality gates → (2) distributed gateways + observability → (3) federation to 50+ domains with API Score and monetization.

**Diagnosis before the choice (C>P>E>M).** Strategy starts by understanding the context, not by deciding. The four layers, applied:
- **Customer:** the producer domain and the developer; JTBD = "expose my capability safely, without waiting in the queue."
- **Product:** an exposure platform in the Growth→Maturity phase; it contributes through digital time-to-market.
- **Company:** a large bank moving from centralized decisions to outcome-oriented teams.
- **Market:** platform engineering + federated governance; regulatory pressure (Open Finance/PIX).

*A blank field is also information:* where I did not have data (real lead time by domain), the CSD recorded the doubt (doc 04).

**Product Strategy 1-pager: the 5 choices **
1. **Business intent:** scale digital channels without API exposure becoming a bottleneck.
2. **North Star:** active reused APIs (doc 03).
3. **Audience:** producer domains + API Champions (not the account holder).
4. **JTBD:** publish and evolve APIs with autonomy and security.
5. **UVP:** "publish in days, not weeks, with governance by default" (doc 04, Lean Canvas).

**Explicit non-goals (what we will *not* do):** not reinforce the single gateway; not create a larger central team; not allow autonomy without guardrails; not buy a market SaaS (the rationale is in doc 05).

**Strategy Choice Cascade (Roger Martin, Lenny's).** "Strategy is an integrated set of choices that compels customer action," and its objective is to **change behavior**.

| Choice | In the case |
|---|---|
| Winning aspiration | Be the standard platform for API exposure: autonomy + governance |
| Where to play | Domains of highest volume/criticality and APIs with **reuse** potential |
| How to win | Self-service **with guardrails** (a barrier that is hard to copy) |
| Capabilities | Contract-first, guardrails in CI/CD, observability, API Champion track |
| Management systems | API Score, dashboards by domain, review rituals |

**"Did behavior change?" test:** the domain **stops opening a ticket** to the center and starts **publishing on its own**; its API starts being **consumed by other domains**.

> **Generalization layer.** The cascade is technology-agnostic. "Where to play" and "how to win" on a data platform would be: start with the domains that consume the most critical data; win through governed self-service instead of tickets to the central BI team.

## 2.6 Clear and ambitious strategy

**Strategy (one sentence):** *"Scale the API ecosystem while preserving governance and security, transferring exposure ownership to the domains."*

**Clarity is the test ** *"if you cannot explain it, you have not understood it."* The sentence above fits in a tweet and already works as a **prioritization tool**: by itself it says what comes in (autonomy + guardrails) and what stays out (reinforcing the center, SaaS, autonomy without control).

**A plan that serves the strategy (never the reverse):** API Champion (Now) → distributed gateways (Next) → federation and monetization (Later). The plan is the tactic; if it changes, the strategy does not.

**Ambition with pragmatism (gardener × builder, Lenny's).** The *builder* plans everything to the end; the *gardener* creates the conditions and leaves room for the unexpected. On a federated platform I plan the **guardrails and the track** (builder), but I let the domains **discover uses and reuses I did not foresee** (gardener). The capability marketplace (Later vision) is born more from gardening than from a blueprint.

## 2.7 Product vision

**Framework "The Vision Captures Strategic Decisions"** + 4 elements (Why, Context, Product, Company) + the 3-pillar test.

> **For** the company and its squads, **dissatisfied with** the inability to expose APIs at scale without losing governance, **our product is** a distributed API-management architecture (federated governance), **that offers** technical autonomy with centralized security, **unlike** single gateways that become a bottleneck. **We are building** an API federation (15,000 → ~30,000  that sustains digital growth without compromising governance.

**Synthesis:** *"That every domain expose and evolve APIs with autonomy, security, and quality, without a central bottleneck."*

**Mission × Vision.** Mission = give domains the ability to integrate and expose financial capabilities in a safe and reusable way. Vision (2-3 years) = a self-service federation where autonomy and governance coexist at scale.

**The 7-criteria test.** The vision above passes all 7: it describes the **motivation** (why), it **looks beyond the solution** (pain + context), it is **shareable**, **measurable** (reuse/lead time), **big without being empty**, **short**, and it **guides decisions** (the domain stops opening a ticket). Add the **3-pillar test**: value for the user ✓ (developer), for the product ✓ (platform), for the company ✓ (digital revenue).

**Vision as narrative (Pixar / Hero's Journey).** Every vision is, in the end, a story. The case arc on the Pixar *spine*: *Once upon a time* there was a bank whose APIs were growing → *every day* each new exposure waited in the central team's queue → *until one day* the single gateway fell and took several journeys down with it → *because of that* we decided to federate governance → *because of that* the domains started publishing on their own with guardrails → *until, finally,* the platform disappeared into the flow and the verticals accelerated. The hero is not the technology. It is the **producer domain**.

**Maximum potential (Tomer Cohen, LinkedIn, Lenny's).** Think backward from the ceiling: **the company as a platform, with business capabilities consumable as APIs by any domain, partner, or ecosystem, and the base of a capability marketplace.**

**The three levels of fit (Shreyas Doshi, Lenny's):** Product-Market Fit → Product-Business Fit → **Product-Ecosystem Fit.** The platform pursues the third level: it is not enough for the product to serve the user (developer) and the business (the bank); it needs to **fit the ecosystem** of domains, partners, and regulators. The *Later* vision (capability marketplace) is, in one sentence, reaching **Product-Ecosystem Fit**.

**Archetype (Lenny's):** this case is led by a **Platform PM** ("builds tools for other teams"). That is why the metrics are **reuse, lead time, and autonomy**, not end-user engagement.

## 2.8 Value proposition

> Let domains **expose and consume APIs with autonomy and speed**, keeping **governance, security, and observability by default**, and replacing the central queue with self-service with guardrails.

**Problem-Solution Fit: the triple filter.** The proposition only holds if it passes all three: **desirable** (domains want autonomy, as shadow gateways and ticket volume signal), **viable** (the company already masters the cloud and CI/CD; automated guardrails pay for themselves by removing the queue), **feasible** (mature stack). If one fails, it is an idea, not a proposition. Tera's reminder: **42% of startups die from "no market need."** That is why I validate the pain (doc 04) before building.

**Value is perceived, not declared (Value Creation).** The value is not "15,000 federated APIs" (output). It is the **domain publishing with autonomy and security, unlocking the launch of digital journeys**. As with coffee (bakery × Starbucks), the same function of exposing an API is worth much more when it comes with governance built in and without a queue. The detail (VPC, pains × pain relievers) is in doc 04 (4.8).

## 2.9 How to capture AND show the platform's value

> **Why this is the most important section of the case.** Showing the value of a platform is the **#1 pain of the Platform PM**. Unlike an end-user product, the platform **does not generate direct revenue**: the credit for the result goes to the vertical that launched on top of it, and what is not shown becomes "cost" on the spreadsheet the first item cut when the budget tightens. Capturing and communicating value is not an accessory of platform work; **it is what keeps the platform alive.**

### The attribution problem (why it is hard)
The platform suffers from an **attribution gap**: whoever harvests the pretty number (more sales on the digital channel, an integration live in days) is the business team; the platform that made it possible stays invisible. Three traps that knock Platform PMs down: (1) measuring **supply** (catalog size) instead of value; (2) trying to "prove own revenue," which is always fragile; (3) having **no number at all**, becoming a cost line.

### The mother rule
Measure the platform by what it **unlocks in the verticals**, never by the size of its own catalog. A platform has no value "in itself"; it has **leverage value**:

> **platform value = value per vertical × number of verticals accelerated.**

It is the *gardener* mindset (Lenny's): the value that grows on its own in the verticals far exceeds the platform team's direct effort. A capability built **once** and consumed by **N domains** is the multiplier that justifies the investment.

### The 4 value vectors (what to measure × how to communicate)

| Vector | Metric (what to measure) | How to communicate it to leadership |
|---|---|---|
| **Speed** | exposure lead time; **DORA** metrics (lead time, deploy frequency) | *cost of delay* (Reinertsen): each week saved × integrations = **digital revenue pulled forward** |
| **Cost avoided** | API deduplication; central-team effort removed; operating hours per domain | **counterfactual:** *"how much would it cost each domain to build and operate this alone?"* The platform avoids that cost N times |
| **Risk / quality** | P0/P1 incidents avoided; SLA; regulatory compliance | hours of downtime avoided on channels that account for **63% of acquisitions**; Open Finance/PIX deadlines met without a task force |
| **Leverage / reuse** | **active reused APIs** (North Star); number of verticals served | 1 capability built once, consumed by N domains: the **multiplier** only the platform delivers |

### The "would they pay?" test (Team Topologies / platform-as-a-product)
A good internal platform is one that teams **would choose** to use even if they could build it themselves. That is why **voluntary adoption** (pulled adoption) is the most honest proof of value: if the domain migrates without being forced, the **internal market has already voted**. Practical tools: a **showback** (show each vertical how much it consumed and saved, without actually charging) turns invisible value into a visible number; and a **portal eNPS** ("would you recommend publishing through here?") captures the value the developer perceives.

### How to *show* it (executive communication)
Golden rule (Lenny's, *quantify the unsexy*): **every platform initiative goes up to leadership with a business number beside it, or it does not go up.** Never *"we modernized the gateway"*; always *"we freed ~2,800 integration-days/year, removed the single point of failure, and met the regulatory deadlines without a task force."* A **value dashboard by vertical** (speed + cost avoided + risk + reuse, by domain) is the artifact that takes the platform off budget defense.

### Value anchor 
> *To validate with Finance:* 20→6 days = **~14 days** of time-to-market recovered per integration × **~200 integrations/year** ≈ **~2,800 integration-days/year** freed. Add the **cost avoided** (deduplication + operations that leave the center) and the **risk avoided** (generalized incidents). 

> **Generalization layer.** Every horizontal platform captures value the same way: it does not generate direct revenue; it **shortens the verticals' path to revenue**. Quick test: *if you cannot name the vertical that got faster because of the platform, you have not yet shown its value.* Measure vertical speed, cost avoided, risk avoided, and reuse never catalog size.

**References for this section:** The "quantify the unsexy" lens (Lenny's, Ravi Mehta) and *gardener × builder*; platform literature: *Team Topologies* (Skelton & Pais, platform-as-a-product / voluntary adoption), *Accelerate*/DORA (Forsgren, Humble, Kim), *Principles of Product Development Flow* (Reinertsen, cost of delay), SPACE (DevEx, doc 03).
</script>

<script type="text/markdown" data-title="03 · Metrics and KPIs">
# Module 3: Metrics for Digital Products
### Case: Horizontal API Platform

## 3.1 Data in digital products

**The information hierarchy:** data (raw number) → measure (grouped with context) → information (meaning) → **metric** (tells the story and answers a root question). E.g.: request counters (data) → number of consumers per API (measure) → % of APIs with >1 consumer (information) → **reuse** (metric). A number with data but no root question is a **vanity metric** (e.g., "total APIs published").

**Criteria of a good metric (Lean Analytics):** it is a **comparison**, it is easy to understand, and it is a **ratio/rate**, not an absolute value. That is why the case measures *reuse* (a rate) and *lead time* (by domain), not "total APIs."

The transformation started by **instrumenting** what the central gateway did not give: the CSD recorded "we do not have indicators by domain." Without instrumentation, federation would be autonomy in the dark. The metric measures **behavior** (what teams do) with an agility and scale that qualitative research does not have.

## 3.2-3.3 KPI Karta

A KPI is never born loose: it **comes down from an objective and up from measures**.
**Objective → Critical Success Factors → KPIs → Metrics → Raw measures.**

| Layer | In the case |
|---|---|
| Objective | Scale exposure while sustaining digital growth, without losing governance |
| CSFs | autonomy · quality · reliability · efficiency |
| KPIs | lead time; APIs reused/domain; API Score; SLA; tickets/dev |
| Metrics | P95/P99; 5xx rate; % rejection at gates; auth failures; MTTR |
| Measures | logs, traces, counters, deploy events, tickets |

Origin in the **developer journey**: Discover → Understand/test → Publish → Operate → Evolve. A good KPI answers: *"does this move the objective?"* If it does not move it, it is a vanity metric.

## 3.4 North Star + the supply↔reuse gap (the most important point of this doc)

Three metric layers: **problem** (lead time, tickets/dev, incidents) · **solution** (% of domains with an API Champion, APIs migrated, portal use, API Score) · **business** (APIs sustaining channels, availability, cost avoided, potential revenue).

**North Star: "active reused APIs":** APIs in production with **recurring consumption**, by **multiple consumers**, within the SLA.

*Why not "APIs published with quality in self-service"?* Because that measures **supply**, not **value**: it is the output × outcome trap. On a platform, value = **consumption and reuse** (the source itself talks about "potentiating reuse"). The North Star has to live on the **demand** side and embed three things: consumption (active) + reuse (multi-consumer) + durability (recurring).

**Retention as an input (anti "zombie API").**
1. API retention: % of APIs that keep consumption month over month.
2. Consumer retention: domains/partners that come back to consume.

| Layer | Metric |
|---|---|
| North Star | Active reused APIs (recurring, multi-consumer, within the SLA) |
| Inputs: adoption | APIs with real consumption; number of consumers per API |
| Inputs: retention | % of APIs with recurring consumption month over month; consumer retention |
| Inputs: supply | lead time, API Score, % self-service (supply is an **input**, not the NSM) |
| Guardrail | P0/P1 incidents, 5xx rate, availability |

**API Champion activation (Airtable, Lenny's).** Onboarding is the undervalued lever.
- **Single-player:** the domain publishes its 1st API in self-service.
- **Multi-player (the one that matters):** that API is consumed by ≥1 other domain → it became **reuse**. It is the direct bridge to the North Star.

> **Generalization layer.** Any horizontal platform gets the North Star wrong if it measures supply. Design system: the NSM is not "number of components published." It is "% of production screens built with the system." Data platform: it is not "number of datasets." It is "datasets reused by multiple squads." Measure consumption, not the catalog.

## 3.4.1 Measuring the developer experience: SPACE (Lenny's / Nicole Forsgren)

If the **platform's user is the developer**, measuring only lead time and volume is insufficient, because that measures the pipeline, not the experience of whoever uses it. The **SPACE** framework gives rigor to DX and avoids the vanity metric "lines of code / APIs published":

| SPACE dimension | What it measures | Metric in the case |
|---|---|---|
| **S**atisfaction | developer satisfaction and well-being | DX survey / Developer Portal eNPS; "would you recommend publishing through here?" |
| **P**erformance | the outcome of the work, not the effort | **reuse** of the published API (multi-player); success rate in production |
| **A**ctivity | output volume (use with caution) | number of APIs published, deploys: **input**, never the NSM |
| **C**ommunication/collaboration | fluidity between teams | discovery time in the catalog; number of trips to the central team |
| **E**fficiency/flow | work without friction or waiting | exposure lead time; % of the flow in self-service without a ticket |

> **Insight (Lenny's, DevEx):** "focus on *outcome* and experience, not on output such as lines of code." SPACE reinforces exactly the North Star choice: **Performance = reuse**, while Activity (published volume) stays in the footer as an input. A DX dashboard that only grows in "Activity" and not in "Satisfaction/Efficiency" is a signal that the platform became a pipeline, not a product.

## 3.4.2 Why I do not use AARRR or HEART "raw"

The classic frameworks assume a **consumer funnel** (Acquisition→Activation→Retention→Revenue→Referral, or AARRR) or end-user engagement (HEART, from Google). Here the user is **internal and adoption is pulled**, so I translate instead of copying:
- **AARRR** → *domain adoption* → *single-player activation* (1st publish) → *multi-player activation* (reuse) → *retention* (recurring consumption). There is no "paid acquisition."
- **HEART** → **H**appiness = portal eNPS (≈ SPACE-S); **E**ngagement/**A**doption = % of domains publishing; **R**etention = APIs with recurring consumption; **T**ask success = publish without a ticket.

*Lesson:* borrowing the consumer framework without translating it is measuring the platform with the wrong ruler. And **engagement ≠ retention**; on a platform, what matters is retention/reuse.

## 3.5 OKRs

Formula: *"We will [O] by [deadline] measured by [KRs]."* Cycle ≤ quarterly, 2-5 KRs, every KR with a number.

> **O:** Make API exposure fast and autonomous, without giving up governance.
> - **KR1:** reduce exposure lead time from **20 → 6 business days  (−~70%).
> - **KR2:** raise domains with a certified API Champion from **30% → 70%.
> - **KR3:** migrate **10 domains/quarter to distributed gateways (cumulative target 50+).
> - **KR4 (protection):** availability ≥ **99.95%; P0/P1 incidents from a single point of failure = **0**.
> - **KR5 (reuse, the one that ties to the North Star):** **≥ 40% of the pilot's APIs consumed by ≥1 other domain in 1 quarter.

Three progress KRs + one protection KR + **one reuse KR**, so the OKR does not become a supply metric in disguise.

## 3.6 Hypothesis testing

**Test Card, 4 non-negotiable fields:**
> **Based on** (evidence): the ticket distribution (doc 04) shows that ~85% are "publishing / standard / docs."
> **We believe that** certifying API Champions + automating quality gates **will reduce the pilot's lead time**.
> **Measured by**: exposure lead time (primary); multi-player reuse and incidents (secondary).
> **We will be right if**: lead time drops **≥40% in 1 quarter**, **with no** increase in incidents, and **≥40%** of APIs are reused.

The **acceptance criterion is agreed BEFORE** the test; otherwise the result becomes a political negotiation ("0.3% is already a victory"). Afterward, the hypothesis becomes a **Learning Card**: we believed → we observed → we learned → what we will do.

**Discarded hypotheses (showing what we did NOT follow is as important as what we followed).**

| Hypothesis considered | Why it was discarded |
|---|---|
| "Improving central documentation is enough to end the queue." | The ticket distribution showed that versioning and approval also weigh; docs alone do not remove the queue. The pain is *missing self-service*, not only missing docs (counters H2). |
| "Growing the central team solves the bottleneck." | People scale linearly; APIs grow exponentially → **diseconomies of scale** (doc 05). Reinforcing the center keeps the single point of failure. |
| "Publishing faster, by itself, increases reuse." | Supply ≠ demand. Publishing does not make anyone *discover* and reuse; without discovery, more supply becomes a "zombie API." This is exactly the **supply↔reuse gap**. |
| "An API Score ranking motivates teams to have quality." | Risk of becoming a **dark pattern / punitive ranking** (doc 05). Discarded as a primary mechanism; the API Score stays as a *learning nudge*, not a competition. |

**Test Card 2: "discover before you create" (portal/catalog MVP).** The North Star is reuse, but reuse does not happen if the developer does not **discover** the API that already exists before creating a new (duplicate) one. This is the most fragile belief on the **demand** side, and a roadmap that starts with supply needs to validate it early:

> **Based on** (evidence): duplicate APIs in the ecosystem (several doing almost the same thing) and very low use of the old catalog.
> **We believe that** if the developer easily finds an existing API that solves their need, they **reuse instead of creating** a new one.
> **Behavior to validate:** the developer **searches the catalog before creating** a new API.
> **Measured by:** % of "new API" intents preceded by a catalog search; number of duplicate APIs avoided; reuse rate.
> **We will be right if:** **≥ 60% of the pilot's new APIs are preceded by a catalog search, generating at least **N duplicate APIs avoided** through reuse.

**Experiment MVP (cheap, before building the whole portal):**

1. **Wizard of Oz / "reuse counter":** when a developer opens the intent for a new API, a person from the platform team answers manually suggesting existing APIs from the catalog. Validates the **value of discovery** before automating search.
2. **Search prototype (fake door):** a catalog screen with search; instrument the `catalog_search` event **before** `api_contract_submitted` to measure whether search precedes creation.
3. **Nudge at the decision point:** the pipeline, when it receives a new contract, suggests similar APIs: *"a balance API is already published; want to reuse it?"*.

*Why this matters:* it is the experiment that attacks **demand (reuse)** directly, balancing a roadmap that starts with supply. Without validating "discover before you create," the platform accelerates the publishing of *duplicate* APIs the opposite of the North Star.

**Statistical rigor: why the pilot is NOT a clean A/B (Tera).** In A/B there is **H0** (no effect) × **H1** (effect), α (~5%, false-positive risk), and a decision by p-value, with the classic error of confusing *"not rejecting H0"* with *"proving there is no effect"* (it may just be a small sample). But federating is a **model change by domain**, with no control group in the same population. Therefore, the correct design is **before/after by domain** (the domain is its own control) + **stop guardrails**, not a significance A/B. Naming this limitation is what separates rigor from statistical theater.

## 3.7 Tracking Plan: where and how each event is captured

**Principle: the platform instruments, not each team.** Each event is emitted **at the platform layer** (portal, pipeline, gateway), not in each domain's code. That way measurement is **consistent and by default**: the platform itself gives observability, without depending on each squad instrumenting in its own way (it solves the CSD's "we do not have indicators by domain"). **Privacy:** events carry **metadata** (who, when, which API, status), **never payload or sensitive data** (consistent with docs 06 and 07).

| Event | Where it is emitted (source) | How it is captured | Properties: where they come from | KPI |
|---|---|---|---|---|
| **catalog_search** | **Developer Portal** (front-end) | portal analytics SDK → event stream | who_searched (dev/domain, from the **logged-in portal session**), term, n_results, clicked_api | discover before creating; reuse intent |
| **api_contract_submitted** | **Git / CI** (producer domain's repo) | commit/merge-request hook in the pipeline | owner_domain, api_id, version, type (from the **repository + the OpenAPI file**); `preceded_by_search` (**join** with catalog_search by session/author) | lead time (start); volume |
| **quality_gate_result** | **Pipeline (CI)** | guardrail output at the gate | api_id, rule, passed/failed, severity (**from the gate itself**) | % rejection; API Score |
| **api_deployed** | **Deploy pipeline** (CodePipeline) | cross-account deploy event | api_id, environment, canary/blue-green strategy (**from the pipeline**) | lead time (end); deploy frequency |
| **api_request** | **API Gateway / Service Mesh** (runtime) | gateway access log / telemetry (OpenTelemetry) | api_id, **owner_domain**, **consumer_domain**, status, latency, auth (**from the request + the auth token**) | P95/P99, 5xx, auth, **reuse** |
| **support_ticket** | **ITSM / ticketing tool** | integration with the ticket system | domain, category, resolved_by: center × domain (**from the ticket**) | tickets/dev |

**The two identities: what makes reuse measurable (answering "whose property is it?").** Every runtime request carries **two** identities, and neither is typed by anyone:

- **owner_domain** = who **published** the API; it comes from the catalog/registry at `api_deployed`.
- **consumer_domain** = who **is calling** the API; it **comes from OAuth2/mTLS itself**. Because every call is authenticated (the token carries the `client_id`; mTLS carries the client certificate), the **gateway already knows who consumes** on each request. In other words: the reuse property **is not captured on the portal and is not informed by the developer**; it is a byproduct of **mandatory security**. That is why an auth guardrail and a reuse metric are the same thing: **without auth on every call, reuse would be rhetoric; with auth, reuse is a measured fact.**

**How the events stitch together (same `api_id`, same `domain` on all of them):**

- **Lead time** = timestamp of `api_deployed` (t1) − of `api_contract_submitted` (t0), for the same `api_id`.
- **Reuse / multi-player activation** = `api_request` with `consumer_domain ≠ owner_domain` (another domain consuming).
- **Discover before creating** = `catalog_search` followed by `api_contract_submitted` with `preceded_by_search=true` (reused) or by no creation (found it and reused what already existed).

Everything flows to an **event stream / data lake** with a **common schema**, which supports the per-domain dashboards in 3.8. Standardizing that schema **is part of the platform product**, not an extra.

## 3.8 Analytics culture

"You have what you measure." A common metrics language across domains, with a **standardized API Score**, dashboards by domain, and a review ritual, solves two CSD items: "we do not have indicators" and "documentation is scattered." Watch out for biased storytelling: changing scale, baseline, or cut is lying with statistics and destroys the trust that federation requires.

**Institutionalize.** Platform analytics cannot depend on "the PM being good"; it becomes a repeatable process: (1) align to the OKR → (2) investigate (quali+quant) → (3) ideate hypotheses → (4) prioritize (ICE/RICE) → (5) design the experiment (concierge, flag, sometimes code) → (6) synchronize teams (two teams do not test the same funnel without talking) → (7) analyze → (8) document and decide. It is **Product Ops** applied to the platform.

**Wave rollout with feature flags.** Distributing gateways and guardrails does not go from 0 to 100: **5% → 10% → 30% → 50% → 100%** of domains, measuring incidents at each wave. Incremental release is *delivery with risk reduction built in*, the operational materialization of the kill criteria (doc 04).

**Golden rule:** *every delivery has a number beside it*. It is not "we distributed the gateway"; it is "we distributed it and lead time dropped X without incidents going up." **If there is no number, it did not happen.**
</script>
