# Module 4: Product Discovery
### Case: Horizontal API Platform

## 4.1 Customer Development: "get out of the building"

The discovery customer **is not the account holder**: it is the internal **developer and the API Champion**. The pain was measurable, not hypothetical: thousands of developers depended on a central queue to expose any service.

**Reconstructed discovery evidence.** Instead of stating "there was pain," I show what kind of signal supported it:

- **Distribution of tickets to the central team (a typical quarter):** ~40% "how to publish / contract standard"; ~25% "my API broke a consumer when versioning"; ~20% "where is the documentation for X"; ~15% "approval stuck in the queue." → *Insight:* most of it was **resolvable by self-service and living docs**, and did not require the central team.
- **Queue:** perceived exposure lead time between **~2 and 4 weeks** depending on the central team's load.
- **Reconstructed quotes (persona, not a real person):**
  - Dev: *"I know how to write the API. What blocks me is waiting in the central team's queue to publish."*
  - API Champion: *"They gave me responsibility for the domain, but not the tool to publish without asking permission."*
  - Security: *"Decentralizing scares me. My fear is losing visibility of mTLS/OAuth2 when each team does it their own way."*

> **Fact × hypothesis.** *Fact:* there is a high volume of tickets and a central queue. *Hypothesis to validate:* that most of those tickets disappear with self-service + guardrails (and not that "developers only need more documentation").

## 4.2 CSD Matrix

| Certainties | Assumptions | Doubts |
|---|---|---|
| Central gateway = single point of failure and bottleneck | Squads want autonomy | Real lead time by domain? |
| Thousands of developers overload the center | Certifying API Champions reduces tickets | Are tickets resolvable with docs alone? |
| OAuth2/mTLS are mandatory | Guardrails keep the standard without manual review | What level of support does the API Champion need? |
| There are no indicators by domain | Distributing gateways improves the SLA | How much does distributing increase security risk? |
| Open Finance/PIX run in parallel | Domains adopt if they gain speed | Which scattered docs are actually critical? |

## 4.3 Personas

- **API developer (Diego).** Wants to publish fast without becoming a governance specialist. Pain: queue, rework, scattered docs. Gain: publish the same day, with feedback in the pipeline.
- **API Champion (Ana).** Wants the same powers as the central team, in her domain. Pain: responsibility without a tool or autonomy. Gain: publish, version, and operate without asking permission.
- **Security/Architecture Guardian (Sergio).** Wants 100% of APIs with mTLS/OAuth2/observability. Pain: losing visibility when decentralizing. Gain: guardrails that apply the policy **by default**, without depending on human review.

## 4.4 Hypothesis formulation (from doubt to a falsifiable bet)

**Guiding principle (Lenny's, evidence-guided > plan-and-execute).** *"Planning and executing is a risky approach, based on opinion; evidence-guided development, with continuous learning and validation, is superior. And discovery speed matters more than delivery speed."* Translating to the case: before building the federation, I need to know **which beliefs, if false, knock the thesis down** and test them first.

**From doubt to hypothesis:(impact → opportunity → hypothesis → solution).** A hypothesis **is not** a solution. "Create quality gates" is a solution; "most tickets are resolvable by self-service, they do not require the central team" is a hypothesis. The CSD doubts (4.2) become bets with an explicit refutation criterion:

| # | Hypothesis (belief) | Type (CSD) | How I would know it is WRONG (falsification) |
|---|---|---|---|
| H1 | Automated guardrails keep security **without** manual review | Assumption | Any security P0 traceable to a guardrail that passed → **false belief** |
| H2 | Most tickets are resolvable by self-service + docs, not by the center | Assumption | If < 50% of tickets are classifiable as "publishing/standard/docs" → false |
| H3 | Certifying API Champions reduces the domain's lead time | Assumption | If the pilot's lead time does not drop ≥40% in 1 quarter → false |
| H4 | Distributed gateways improve the SLA **without** increasing incidents | Doubt | If incidents/month rise after distribution → false |
| H5 | Domains adopt the model if they gain speed (pulled adoption) | Assumption | If, after the pilot, no domain asks to migrate spontaneously → false |

> **The riskiest bet first (riskiest assumption).** **H1 is the belief that knocks everything down:** if an automated guardrail does not replace manual review in a regulated bank, the federation is unsafe by construction, and nothing else matters. That is why it is the **first** to be tested in the pilot, not the last. This is *solution discovery*, not only *problem discovery* (Lenny's): I do not only validate that the pain exists. I validate that **the mechanics of the solution work**.

## 4.5 Research methods (choose by the type of uncertainty, not by preference)

A research method is a strategic choice; each one reduces a different type of uncertainty (**attitudinal** = what they say × **behavioral** = what they do; **qualitative** = why × **quantitative** = how many). The classic error is choosing the method by preference, not by the doubt. Map applied to the case:

| Doubt to reduce | Method | What I do in the case | Caution |
|---|---|---|---|
| "Does this problem already exist on other platforms?" | Desk research | benchmarks of platform engineering, DevEx, API governance, distributed gateways | it does not replace talking to the developer |
| "Where exactly does the flow get stuck?" | Interview (qualitative) | developers, API Champions, architecture: where it jams (approval, docs, pipeline, dependence on the center) | do not ask them to predict the future ("would you use it?") |
| "What is it like to publish a real API, end to end?" | Contextual research / observation | observe a squad from OpenAPI to deploy; sit in an incident war room | observe, do not guide |
| "How many squads feel each pain, and which is the most frequent?" | Survey (quantitative) | send to dozens of squads: lead time, standard doubt, rework, lack of autonomy | sample and neutral questions; nothing biased |
| "Can the developer publish alone following the guardrails?" | Usability test | test portal, templates, and pipeline with real developers | **do not ask whether it was easy; observe whether it was** |

**Mandatory combination:** quantitative says *where* and *how much* (the dashboard shows that lead time is high); qualitative says *why* (the interview reveals that the queue is the contract standard, not the infrastructure). Good discovery crosses the two: a dashboard alone does not explain cause, an interview alone does not give scale.

## 4.6 Consolidation and synthesis (from loose data to a well-formulated problem)

Research does not end at the interview; the work is the **synthesis**. Tera's chain:
**facts → patterns → insights → opportunities → POV/HMW → solutions.** Without that, discovery becomes "a pile of notes."

**Affinity map.** Loose phrases such as "it takes long to approve," "doubt about the standard," "rework in the pipeline," and "I depend on the central team" group into a single pattern: **"domains lack the autonomy to publish safely."**

**Insight ≠ idea
- *Idea:* "let's create a dashboard."
- *Insight:* **"teams do not trust the indicators because each area measures API quality in a different way."** ("I saw this" + "I know this" = insight.)

**POV (user + need + insight):** *domain squads need to publish APIs with autonomy and predictability, because the centralized model creates dependence, rework, and delay in launching digital journeys.*

**Theme prioritization (frequency × impact):** central queue > versioning rework > scattered docs > missing indicators > single point of failure. That ranking is what feeds RICE (4.15) and the roadmap (doc 05); it is not an opinion. It is an output of the synthesis.

> **Generalization layer.** The sequence *falsifiable hypothesis → the right method for the right uncertainty → synthesis into POV/HMW* holds for any platform. The symptom changes (API queue, data queue, ignored component), but the error is always the same: falling in love with the solution ("let's build X") before formulating the problem. **Love the problem, not the solution.**

## 4.7 Journey (AS-IS → TO-BE)

**AS-IS (centralized):** discover (scattered docs) 😐 → open a ticket 😟 → wait in the queue 😣 → fix the standard too late 😠 → publish on the single gateway 😬 → operate without your own dashboard 😕.

**TO-BE (federated):** portal → Terraform template → OpenAPI contract validated in the pipeline → approval by the domain's own API Champion → self-service deploy (canary/blue-green) → the domain's own dashboard.

## 4.8 Value Proposition Canvas

**Customer profile.** Jobs: expose, consume, version, operate. Pains: queue, rework, docs, single point of failure, absence of indicators. Gains: autonomy, speed, predictability.

**Value map.** Products/services: templates, pipeline with gates, portal, catalog, dashboards, certification. Pain relievers: self-service, validation in the pipeline, distributed gateways, guardrails. Gain creators: self-service deploy, API Score, living docs, monetization.

## 4.9 Experimentation culture and experiment design

The old way, *problem → idea → build → then we see if it worked*, puts contact with the user too late and turns the federation into an expensive and irreversible bet. The new way: **opportunity → hypothesis → experiment → learn → adjust → scale.** And the correct posture (Teresa Torres) is: *"experimenting is not seeking truth; it is reducing uncertainty."* So I experiment to **find out whether I am wrong**, not to prove that I am right (watch out for confirmation bias and sunk-cost bias).

> **Lenny's lens (understand-first → win rate).** *"Do the 'understand work' before building; going slow at the beginning raises the hit rate of experiments."* In the case, instrumenting the pipeline and listening to developers **before** federating is what makes the pilot worth it; an experiment without instrumentation teaches nothing. And: *"experiment a lot, then scale what works; do not assume you already know."*

**Risk map before experimenting.** Not every hypothesis goes straight to a test at scale; first I decide *which risk* I am reducing:

| Risk type | Question in the case | How I reduce it |
|---|---|---|
| Need | do the domains really want this autonomy? | interviews + pulled-adoption signal (H5) |
| Feasibility | can we automate the guardrails in CI/CD? | technical POC of the guardrail before the pilot |
| Usability | does the API Champion operate the standards alone? | prototype + usability test of the pipeline |
| Ethical / regulatory / security | does decentralizing open an auth/exposure gap? | **H1**: security audit in the pilot (maximum risk) |

**Choose the right instrument.** Each stage asks for a method:

| Instrument | Validates                         | In the case                                                         |
| ---------- | --------------------------------- | ------------------------------------------------------------------- |
| POC        | is it feasible?                   | does the automated guardrail block a contract outside the standard? |
| Prototype  | how would it work?                | the API Champion's journey in the portal (4.10)                     |
| **Pilot**  | does it work at small scale?      | **the central experiment: 1 domain, concierge mode**                |
| MVP        | does it solve with the minimum?   | Concierge + minimum guardrails (4.11)                               |
| A/B test   | did it improve a metric at scale? | **does not apply** to the decision to federate                      |

> **Why a pilot and not an A/B.** A/B serves to optimize a variation with volume (button, CTA, ranking), not a **large model change, with many factors at the same time and a medium-term decision**, which is exactly the case of federation. Lenny's reinforces (Linear): high-craft teams launch **early to a small group (1-10)** and iterate, instead of A/B testing everything. The pilot by domain is that "small group."

**A strong hypothesis has structure: "If [X], then [Y], because [rationale]."**
> *"**If** we create a federated model with certified API Champions, automated quality gates, and an API Score by domain, **then** squads will publish APIs with more autonomy and lead time will drop ≥40%, **because** they gain clear guardrails that replace the manual-review queue without increasing incidents."*

**Pilot metric design (one success metric + health + guardrail):**

| Role | Metric | Form |
|---|---|---|
| **Success** (validates the hypothesis) | −% in exposure lead time | **relative** (lead time by domain), not "total APIs" |
| **Health** (side effect) | API Score, % rejection at the gate, multi-player reuse | relative |
| **Guardrail** (stop criterion) | P0/P1 incidents, 5xx, auth failures | pre-agreed limit → pause the rollout |

Sample, duration, and **decision criterion are agreed BEFORE** (avoids stopping early because you are "winning" or killing a good idea for lack of evidence), in direct connection with the pre-mortem *kill criteria* (4.13).

## 4.10 Rapid prototyping

**Why prototype here.** "Federated governance," "API Champion," "distributed gateway" sound abstract to a business stakeholder. A prototype **makes the idea tangible** and serves both to test with the developer and to **align stakeholders and de-risk meetings** (Lenny's: *de-risk / pre-socialize*). The central prototype is the **API Champion's journey**: register the API → fill in the OpenAPI contract → receive automatic validation → see the API Score → fix → publish on the domain's gateway → follow consumption.

**Rules:**
- **Low fidelity first** (flow in wireframe/PowerPoint): do not refine early; a prototype that is too pretty becomes a "mini-product" and kills learning.
- **Disposable:** it exists to test a hypothesis; if it does not work, I learned cheaply.
- **Vertical × horizontal:** *vertical* (go deep on the critical step: contract validation in the pipeline) vs *horizontal* (show the whole journey to communicate the vision). I use both at different moments.

**Wizard of Oz / Concierge for contract review.** I simulate the review: a person from the central team reads the contract and returns the violations. I validate the **value** (does the feedback help the developer?) before investing in the technology.

**Portal/catalog MVP: "discover before you create" (the reuse experiment).** The most important prototype on the *demand* side: a catalog screen with search, to validate the hypothesis that **the developer searches for an existing API before creating a new one** (see Test Card 2, doc 03). Cheap version: a "reuse counter" (Wizard of Oz) suggesting existing APIs when someone opens the intent to create, and a *nudge* in the pipeline: *"a balance API already exists; want to reuse it?"*. If the developer does not search before creating, the platform only accelerates the publishing of **duplicate APIs** the opposite of the North Star.

> **Lenny's lens (perceived simplicity + MLP + dogfooding).** *"Even if the technology underneath is complex, the experience has to be simple."* Because adoption is voluntary, the prototype's bar is not "viable." It is **lovable (MLP)**: templates that work the first time, errors that teach. And the platform team **dogfoods** its own flow: it publishes internal APIs through the same pipeline it offers the domains, feeling the friction before they do.

## 4.11 The choice of the pilot domain (defensible, not generic)

> The question the panel asks: *"Where did you start and why?"* Answering "the highest-volume domains" is weak. The real choice uses **3 weighted criteria**:

| Criterion | Weight | Why |
|---|---|---|
| API volume/criticality | 40% | Where the bottleneck hurts most and the impact shows up fast |
| Team willingness (champion available, autonomy culture) | 35% | The pilot dies if the team does not want ownership |
| Reuse potential (APIs other domains already ask for) | 25% | Ties the pilot to the North Star from day 1 |

**Product decision:** start with **a high-volume transactional domain with a volunteer API Champion and APIs already demanded by other teams** (e.g., an "accounts/balance" domain whose APIs are consumed by several channels). Deliberately avoid regulatory domains in the pilot, because the design imposed by the regulator gives less freedom to prove the model.

> **Forward-deployed model (Palantir, Lenny's).** *"Solve ONE customer's problem very well, then **abstract the solution into a product** for everyone else."* It is the spine of the scale strategy: the pilot is not a disposable test. It is the **prototype of the platform product**. You solve the first domain in concierge mode, abstract what worked (templates, guardrails, track), and only then replicate to 50+ domains. Scaling before abstracting recreates the central bottleneck under another name.

## 4.12 Lean Canvas (9 blocks)

> **Reframe that sustains the canvas:** this is an **internal platform**. "Revenue" is not its own billing. It is **value captured by the company** (digital revenue enabled + cost avoided). Pretending the platform sells outside would be weak; assuming that it **shortens the verticals' path to revenue** is the defensible argument.

| Block | Contents |
|---|---|
| **1. Problem** | (a) exposing a new API depends on a single queue in the central team (lead time of weeks); (b) centralized gateway = single point of failure (one incident takes several journeys down); (c) no indicators by domain + scattered docs → rework and knowledge held hostage by one team. |
| **Current alternatives** | reinforce the central team; manual tickets; "shadow IT" (teams hacking outside the standard); buy an API-management SaaS. |
| **2. Customer segments** | producer business domains; **API Champions**; consumer developers; security/architecture; partners/regulatory ecosystem. |
| **Early adopters** | a **high-volume transactional** domain, with a volunteer API Champion and APIs already demanded by other teams (see 4.11). |
| **3. Unique value proposition (UVP)** | *"Publish and evolve APIs in days, not weeks, with governance and security built in by default, without depending on a central team."* **High-level concept:** the "governed self-service" of API exposure, a *cloud-like* model for the company's domains. |
| **4. Solution** (matched 1:1 with the problem) | (a) **API Champion + certification track** → autonomy with responsibility; (b) **contract-first + automated quality gates** → standard without a human reviewer; (c) **distributed gateways per account + observability by domain** → end of the single point of failure; (+) **portal + catalog + living docs** → discovery and the end of scattered docs. |
| **5. Channels** | Developer Portal and catalog; self-service pipelines; certification track; **showcases of migrated domains** (social proof + inner source); living documentation generated from the contract. |
| **6. Value sources (captured revenue)** | digital revenue enabled (integration time-to-market); operating cost avoided (fewer generalized incidents, less central-team effort); **potential monetization of restricted APIs** (partners/white-label) in *Later*. |
| **7. Cost structure** | platform team (the old "center," now building product instead of operating a queue); cloud infrastructure per domain/account; building and maintaining guardrails/pipelines; enablement and certification. |
| **8. Key metrics** | **North Star: active reused APIs.** Inputs: exposure lead time, % of domains with a champion, **multi-player activation**, SLA and P0/P1 incidents (guardrail). |
| **9. Unfair advantage** (what is neither copied nor bought) | **it is not the gateway technology** (anyone can buy that). It is the combination of: guardrails + observability **native to the cloud the company already masters**; **proprietary regulatory fit** (Open Finance/PIX); an installed base of **15,000+ APIs**; and the **API Champion network**, an internal network effect + inner source that takes years to build. |

**PMF + TAM/SAM/SOM.** TAM = ~30,000 APIs in the ecosystem; SAM = APIs with governable reuse; SOM = from the pilot to **50+ domains**. **PMF signal:** domains **pull** the model for speed (they ask to migrate), instead of being pushed.

> **Generalization layer.** The most transferable block is the **unfair advantage**. On any horizontal platform, the technology is a commodity; what cannot be copied is the network of enabled producers, the proprietary context (regulatory, data), and the native integration with the environment the company already masters. If your "unfair advantage" is something a competitor buys in a SaaS, you do not have an advantage. You have a feature.

## 4.13 Risk mitigation + Pre-mortem

> *Two lenses, on purpose: 4.9 asks "which risk to reduce **before experimenting**"; this one asks "what knocks the product down **when scaling**" (pre-mortem).*

Discovery is risk mitigation (Tera): the question is not "which tool to use?" It is *"which risk am I reducing now?"* The PM is the **guardian of the process**: they do not mitigate everything alone, but they make sure each risk has an **owner, evidence, and priority**.

**The risks, with owner and evidence threshold (each area mitigates one type):**

| Risk | Question | Who mitigates | Sufficient evidence to proceed |
|---|---|---|---|
| Value | do they want autonomy or is it only missing process? | PM | high lead time + pulled adoption (H5) in interviews |
| Business | does it scale without +risk and does it pay for itself? | PM + Finance | pilot with no increase in incidents; value anchor (doc 02) closes |
| Usability | does the Champion operate the standards alone? | Design/DX | ≥X% publish without a ticket in the usability test |
| Technical | do gateways + guardrails scale with security? | Eng./Architecture | SLOs green in the pilot (5xx/P95/P99/auth) |
| Regulatory/Security | does the exposure meet the regulators? | Security + Compliance | **independent audit with no P0 (H1)** |

**Prioritize by importance × uncertainty (Tera, not by noise):**

| | Low uncertainty | High uncertainty |
|---|---|---|
| **High importance** | technical scale of the gateways (known stack → the pilot confirms) | **H1: guardrail without manual review → TEST FIRST**; reuse (supply × demand) |
| **Low importance** | throttling / tuning | naming / detail UX |

**H1** falls in the high-importance + high-uncertainty quadrant: it is the assumption that, if false, knocks the federation down. That is why it is the first one in the pilot (ties to 4.4). Technical scale is important but of **low** uncertainty (the company already masters the stack), so the pilot only confirms.

**Pre-mortem (Annie Duke, Lenny's): "It is 2027 and the federation failed. Why?"**

| Red flag | Signal (metric) | Kill / pivot (agreed *before*) | Who monitors |
|---|---|---|---|
| Developers create "shadow gateways" | > **15%** of APIs outside the flow | review guardrails/UX | Platform |
| Security incidents rise | any **security P0** | freeze expansion | Security |
| API Champion becomes a local bottleneck | pilot lead time does not drop **≥40%** | revisit the role/automation | Platform + domain |
| Volume publishes, but reuse does not grow | multi-player activation **< 40% in 1 quarter** | **reprioritize consumption before more supply** | PM |

The *"who monitors"* mirrors RAPID (doc 06); the triggers are the same as the ADR ("when to review," doc 05).

## 4.14 Continuous Discovery

**Context defines the method.** Here discovery is **internal B2B/enterprise**: the "customer" is the domain and the developer. It is not a large research done once. It is a **continuous cadence** (Teresa Torres, *Continuous Discovery Habits*), because the context changes all the time: new domains, new digital journeys, new regulatory requirements.

**The ritual (what I do every week):**
- **Voice of customer (Lenny's):** an *API Champions council*, with a fixed weekly contact with the producers, not with whoever only consumes a report.
- **Multiple channels:** support tickets, incident war rooms, portal analytics, gate rejections. Each channel is a continuous pain sensor.
- **Centralize the learning:** the insight cannot die in the head of whoever interviewed (ties to the synthesis, 4.6).

**How I ask.** Never *"would you use this feature?"* Always *"how do you publish an API today? what happens when it goes wrong? when was the last time?"* Discovery is not showing a solution and asking for an opinion.

> **The B2B trap applied to the platform.** A large and influential domain asks for a **custom feature** or a **guardrail exception**. The error is to serve it directly. The platform PM has to separate: **customer request × real need × scalable opportunity × customization that should NOT enter the core.** If every platform becomes a patchwork of one customer's requests, it stops being a platform. The filter question: *"is this a structural pain of several domains or one team's whim?"*

**Opportunity Solution Tree (Teresa Torres):** outcome (**reuse**) → opportunities (queue, rework, discovery/duplication, fear of losing control, missing indicators, enablement) → solutions → experiments. It is what keeps discovery tied to the outcome and feeds the roadmap (doc 05) continuously, not in a big bang.

## 4.15 Prioritization (User Story Mapping + RICE/Kano/4BB)

**Story Mapping (Jeff Patton): the spine of the journey, not a list.** The **high-level activities** (backbone) are the producer's journey: **Discover → Publish → Operate → Evolve.** Under each one, the sub-tasks:

| Discover | Publish | Operate | Evolve |
|---|---|---|---|
| search the catalog | template + OpenAPI contract | domain dashboard | version without breaking the consumer |
| read living docs | validation in the pipeline (gate) | 5xx/latency alarms | deprecate with notice |
| see who already consumes | self-service deploy (canary) | throttling | measure reuse |

**Walking skeleton (first slice = the pilot):** the smallest vertical slice that crosses a domain's whole journey: publish 1 real API, end to end, with minimum guardrails. The following slices become **Now / Next / Later** (doc 05).

**RICE with explicit units (not a magic number).** For the score to be an honest conversation, each factor has a unit:
- **Reach:** number of domains impacted per quarter.
- **Impact:** how much it moves the **North Star (reuse)**, the "common currency" (DoorDash, Lenny's).
- **Confidence:** % confidence in the estimate (discovery evidence).
- **Effort:** person-months of the platform team.

| Initiative | Reach | Impact | Confidence | Effort | RICE |
|---|---|---|---|---|---|
| API Champion certification | 10 | 3 | 90% | 3 | **9.0** |
| Quality gates (shift-left) | 10 | 3 | 80% | 4 | **6.0** |
| Developer Portal + catalog | 10 | 2 | 80% | 4 | **4.0** |
| Distributed gateways | 8 | 3 | 70% | 6 | **2.8** |
| Monetization | 4 | 2 | 50% | 6 | **0.7** |

> **RICE is a conversation tool, not a scientific formula**; the scores make the trade-off explicit. And **thinking in opportunity cost yields more than ROI** (Shreyas Doshi, Lenny's): the question is not "does this return?" It is "is this the **best** thing the platform team can do right now?".

**Two complementary lenses:**
- **Kano:** guardrails = *must-have* (without them the federation does not even exist); self-service and dashboards = *performance* (the more, the better); monetization and intelligent discovery = *delighters*.
- **4BB (Anuj Rathi, Lenny's):** *Brilliant Basics* = quality gates + docs that work; *Bread & Butter* = certification + portal (the day to day); *Big Bets* = distributed gateways + monetization; *Breaking Bad* = kill the central gateway and the "zombie APIs." It categorizes the backlog by **type of bet**, complementing the RICE ranking.

## 4.16 Working Backwards: PR/FAQ (Amazon, Lenny's)

> **Future press release:** *"The company launches API self-service: domains publish in days, not weeks, without losing governance. Lead time −~70%; base of 15,000 → ~30,000 APIs; with mTLS/OAuth2/observability by default."*

**FAQ:**
- *Does decentralizing increase risk?* No. Mandatory guardrails in every account apply the policy by default.
- *Who operates?* The domain, via the API Champion.
- *And whoever does not want to migrate?* Adoption pulled by value, sequenced, not imposed.
- *What is the biggest risk?* Publishing without reuse. That is why the North Star measures **reused** APIs, not published ones.

> **Generalization layer.** Discovery of a horizontal platform is always "internal": the user is the team that builds on top. The pains repeat on any platform: central queue, rework, lack of visibility, and fear of losing control when decentralizing. And the trap is always the same: confusing "the team complained about documentation" with "the problem is documentation."
</script>

<script type="text/markdown" data-title="05 · Product delivery">
# Module 5: Product Delivery
### Case: Horizontal API Platform

## 5.1 Value proposition and market analysis

Market trend: **platform teams + federated governance** ("data mesh" applied to integration). What changes the game is not gateway technology itself. It is the **operating model** that returns ownership to the domains.

## 5.2 Build vs. Buy: the decision the panel attacks most (now explicit)

> Discarding "buy an API-management SaaS" in one line is the classic error that exposes confirmation bias. Here the decision is **weighted and defended**.

**Alternatives considered:**
- **(0) Reinforce the central gateway.** More capacity in the same model.
- **(1) Buy a market SaaS** (e.g., Apigee, Kong, MuleSoft).
- **(2) Build federated on the company's own cloud** (dedicated accounts + guardrails).

**Weighted decision matrix (defensible logic):**

| Criterion | Weight | Reinforce the center | Market SaaS | Federate on our own cloud |
|---|---|---|---|---|
| Scale without a single point of failure | 25% | 1 | 3 | 5 |
| Regulatory fit (Open Finance/PIX, sensitive data) | 25% | 3 | 2 | 5 |
| Isolation by domain/account | 15% | 1 | 3 | 5 |
| Time-to-value | 10% | 4 | 4 | 3 |
| Total cost (license + operations) at a scale of tens of thousands of APIs | 15% | 3 | 2 | 4 |
| Lock-in / control of evolution | 10% | 3 | 2 | 5 |
| **Weighted score** | | **2.20** | **2.65** | **4.70** |

*(Scale 1-5. Score = sum(weight × score).)*

**Why SaaS loses despite time-to-value.** At a scale of tens of thousands of APIs in a regulated sector, the two highest-weight criteria **regulatory fit** and **scale without a single point of failure** penalize SaaS: license cost grows non-linearly, isolation by account is limited, and evolution stays stuck to the vendor's roadmap. The company already masters the cloud and CI/CD; building on it maximizes control and fit.

**Product decision:** **build federated on the company's own cloud**, conditioned on validation by a pilot (see ADR, 5.9).

**Honest trade-off:** federating increases **management complexity** (more accounts, more surface). Mitigation: mandatory guardrails in **every** account, turning policy into code.

> **Generalization layer.** Every platform leader faces this same Build vs. Buy. The rule: buy when the capability is a *commodity* and is not a differentiator; build when it touches **regulation, sensitive data, or the company's own operating model**. The right answer depends on the weights, and making the weights explicit is what separates a decision from an opinion.

## 5.3 Business Model Canvas

> **Coherence with the Lean Canvas:** the Lean Canvas looks at the *bet* (problem → solution → why it wins). This BMC looks at *sustainable operations* (how the platform pays for itself and stays alive). Same reframe: because it is an **internal** platform, the revenue column is **captured value**, not its own billing. Where there is a business premise, I mark the validation.

| Block | Contents |
|---|---|
| **Customer segments** | producer business domains; **API Champions**; consumer developers; security/architecture; partners and the regulatory ecosystem. *It is not the account holder*: the customer is internal. |
| **Value proposition** | expose and consume APIs in days, not weeks, with governance and security **by default**; autonomy with guardrails; observability and catalog ready. |
| **Channels** | Developer Portal + catalog; self-service pipelines; certification track; showcases of migrated domains (social proof/inner source). |
| **Relationship** | self-service first; **inner source** (domains contribute back to the platform); L1/L2/L3 support as a safety net, not as the default queue. |
| **Value sources (captured revenue)** | digital revenue enabled (integration time-to-market → §5.3.1 below); **operating cost avoided** (fewer generalized incidents, less central-team effort); **potential monetization** of restricted APIs (partners/white-label) in *Later*. |
| **Key resources** | platform team; cloud infrastructure (Transit/Shared/Outbound accounts); guardrails as code; central catalog; **the API Champion network** (a resource that takes years to form). |
| **Key activities** | contract-first + quality gates; operation of guardrails/observability; champion certification and enablement; evolution of the portal/catalog. |
| **Key partnerships** | cloud provider; security, architecture, and compliance areas; regulators (Open Finance/PIX) as de facto stakeholders. |
| **Cost structure** | platform team (the largest share); infrastructure per domain/account; building and maintaining guardrails/pipelines; certification track. **Nature:** cost is mostly fixed → **economies of scale** (cost per API falls as volume grows). |

### 5.3.1 The math that closes the model (why the platform pays for itself)

> **Defensible logic (numbers, premise to validate with Finance):**
> The platform's cost is **fixed** (team + base infrastructure). The value it captures **grows with use**: each integration that ships in 6 days instead of 20 returns ~14 days of time-to-market; each generalized incident avoided saves hours of downtime on channels that account for 63% of acquisitions. The break-even point is the volume at which *integration-days recovered + avoided incident cost > the platform's fixed cost*. Because cost is fixed and value is linear in volume, **the more federated domains, the better the return** the opposite of the central gateway, whose marginal management cost grew with scale.

**Business insight:** the old model had **diseconomies** of scale (more APIs = more bottleneck and more coordination cost at the center); the federated model has **economies** of scale (more APIs dilute a fixed cost). That inversion  from a cost that grows with volume to a cost that dilutes in volume is the real financial justification for federation.

> **Generalization layer.** Every good horizontal platform turns a cost that grew with scale (central coordination) into a fixed cost that dilutes (the platform). If your platform gets *more expensive to operate* with every new vertical, it is still a bottleneck with another name, not a platform.

## 5.4 Roadmap (Now/Next/Later): priority falls out of the narrative

**Narrative (roadmap JTBD, Lenny's):** *"First we return autonomy (Now); then we remove the single point of failure and give visibility (Next); then we harvest reuse and value at scale (Later)."* The order is not arbitrary; it is the logical consequence of the story.

- **NOW:** *transfer ownership, cut rework:* API Champion + track; contract-first + quality gates; catalog/portal v1. **Metrics:** lead time, % rejection, tickets/dev.
- **NEXT:** *end of the single point of failure + visibility:* distributed gateways per account; observability by domain; self-service deploy (canary/blue-green), throttling. **Metrics:** SLA, P95/P99, 5xx, incidents, API Score.
- **LATER:** *scale + capture value:* federation to 50+ domains with API Score; monetization; intelligent discovery. **Metrics:** % in self-service, **reuse**, revenue, adoption.

**Output × Outcome:** the roadmap starts from "reduce lead time and scale governance," not from "create gateways."
**Caution (Lenny's, solution deepening before market widening):** only move to monetization/expansion after **reuse and retention are solid** in the core domains. Diluting focus early is the classic platform error.

## 5.5 UX / DX: the developer experience is the product

**UX is not a pretty screen (Tera, Garrett's 5 planes).** Experience has layers, from the bottom up: **strategy** (reduce lead time without losing governance) → **scope** (publish, version, operate, evolve) → **structure** (architecture of the catalog and the flow) → **skeleton** (wireframe of the portal and the pipeline) → **surface** (the UI). Discussing a button before the strategy is building from the roof tile down to the foundation. Here **DX is the product**: the flow *discover → understand/test → publish → operate → evolve* needs to be *lovable* (MLP), because adoption is voluntary. "API design system" = OpenAPI standards + Terraform templates + guardrails.

**UX as risk mitigation (Tera).** The UX process attacks three risks before delivery: **value** (will the developer adopt?), **execution** (can we build it with quality?), **viability** (does it make sense for the bank?). Posture: *"do not accept everything the developer asks, everything engineering wants, or everything design discovers, but listen and consider."* A platform PM is neither an order-taker nor the owner of the truth.

## 5.6 Behavioral design: change behavior, with ethics

Federation is, at its core, an **organizational behavior change**: from "open a ticket" to "publish alone, with quality from the start." Behavioral design is the lever.

**Fogg (B=MAP):** **motivation** (speed) + **ability** (templates and guardrails lower the effort) + **trigger** (the pipeline asks for the contract; the API Score shows up on the PR). Make the **right path the easy path**: a safe *default* (the template already comes with OAuth2/mTLS), *immediate feedback* (API Score in the pipeline), and *social validation* (dashboards showing the domains with the best quality and the lowest lead time).

> **Nudge × dark pattern: the ethical line (Tera).** The API Score is a *healthy nudge* (it helps the team raise quality) **as long as it does not become a punitive ranking**. In a regulated bank, the difference between guiding and manipulating is intent + transparency + real benefit for whoever uses it. Rule: the panel exists for **learning**, not to expose teams or create fear.

**The PM fights their own biases (Tera).** The biggest discovery risk is **confirmation bias**: researching only to validate the federation I already wanted. That is why the hypotheses are **falsifiable** and the riskiest one (H1) is tested first (doc 04).

## 5.7 Agile and technology processes

**Dual Track.** Discovery ("are we building the right thing?") and Delivery ("are we building it the right way?") run in parallel. Delivery pressure cannot kill discovery, or the team accumulates **learning debt**. The pilot by domain is where the two tracks meet.

**Contract-first enables parallelism.** Once the OpenAPI contract is defined, provider and consumers work at the same time (the consumer against a mock). Pipeline: GitLab → GitLab CI (validations/build/versioning) → CodePipeline/CodeBuild (cross-account deploy in dev/homolog/prod).

**Guardrails = the governance "definition of done":** policy becomes an automatic gate, not a human review. And the rollout is **incremental** (feature flags in waves 5→10→30→50%, doc 03): delivery with risk reduction built in.

## 5.8 Cloud architecture

API Gateway (north-south) + Service Mesh (east-west); REST/gRPC depending on context. Accounts with distinct responsibilities: **Transit** (on-prem ↔ cloud via Direct Connect), **Shared** (internal communication, VPC Endpoints), **Outbound** (Internet/partners, firewalls). IaC with **Terraform**; **OAuth2/mTLS + guardrails**; observability (metrics/logs/traces/alarms) without exposing sensitive data. **Central trade-off:** isolation by account × complexity, resolved with guardrails in every account.

## 5.9 Decision-making (ADR + Product Sense)

**Decision type (Bezos).** Federating is **Type 1** (high impact, hard to reverse), so it requires more analysis, consultation, and a **reversible pilot** that turns it, in practice, into a sequence of **Type 2** decisions (testable, with a way back). I do not wait for certainty: I decide at the **sufficiency threshold** (enough signals + a pilot), making the risks explicit.

**Triangulation:** the decision converges three sources: **quantitative** (lead time, incidents, tickets), **qualitative** (interviews with developers/champions), and **market** (platform engineering + federated governance). Neither dashboard alone nor interview alone.

**Dominant lever (Pareto).** The biggest lever **was not "create another gateway."** It was **autonomy with guardrails** (API Champion + gates + API Score): the smallest intervention that moves the result the most.

**Product trio.** PM (value + business viability) + Design/DX + Tech decide together; the PM **facilitates ambiguity**, they do not decide for engineering. Special attention for a TPM, whose technical depth can make them decide alone.
</script>

# Module 6: Leadership and Negotiation
### Case: Horizontal API Platform

## 6.1 Leadership and Negotiation

Large organizations move from **hierarchy to networks**. In that context, the platform PM leads **without authority**: through context, influence, trust, negotiation, and evidence. The biggest barrier is not technical. It is **cultural**. Autonomy only works with **shared context** and psychological safety (Lencioni's 5 dysfunctions: without trust, there is no productive conflict and no commitment).

**The conflict of interests is the heart of the case.** A horizontal platform lives in the middle of legitimate tensions:

| Area | What it wants | Central tension |
|---|---|---|
| Business | accelerate digital channels | speed × control |
| Squads | autonomy to publish | autonomy × standard |
| Architecture | consistency | standardization × flexibility |
| Security | mTLS, OAuth2, control | control × speed |
| Operations | predictability | stability × change |
| Governance | visibility | centralization × decentralization |

**The PM's role:** create a **shared context** ("reduce lead time without losing governance") and negotiate a model that is *neither fully central nor uncontrolled*. The decisive insight: **the leadership solution IS the product solution.** API Champions give power + responsibility; guardrails give control without manual review; API Score and dashboards give visibility. The product materializes the political agreement.

> *"A senior PM is not the person who controls more people; it is the person who creates clarity, trust, and alignment."*

**Technical × adaptive challenge (Heifetz).** "Creating a quality gate in the pipeline" is **technical** (a specialist solves it). "Getting 50+ domains to adopt federated governance with autonomy and responsibility" is **adaptive**: it requires changing belief, status, and the way people work. The classic mistake is to treat an adaptive problem with a technical solution: ship the tool and assume adoption comes with it. Here the tool is necessary, but the leadership work is the **adaptive** work.

**People do not resist change; they resist loss.** Before selling the gain, map what each area **fears losing**:

| Area | Perceived loss | How I address it |
|---|---|---|
| Security | control / visibility | guardrails give *more* visibility than manual review |
| Architecture | standardization | contract-first + templates standardize through code |
| Central team | relevance | becomes the **platform owner** (builds), not a queue |
| Domains | responsibility without preparation | track + certification + support |
| Business | production risk | reversible pilot + kill criteria |

Good negotiation starts by **addressing the loss**, not by selling the gain.

## 6.1.1 Decision rights in the federation: RAPID (Coinbase, Lenny's)

Federating ownership without defining **who decides what** only trades a bottleneck for confusion. The **RAPID** model (Recommend, Agree, Perform, Input, Decide) makes decision rights explicit and answers the question the panel asks: *"who approves an exception to a guardrail?"*

| Decision | Recommends | Agrees | Performs | Input | **Decides** |
|---|---|---|---|---|---|
| Publish/version an API | API Champion | not applicable | domain developer | consumers | **API Champion** |
| New guardrail/standard on the platform | platform team | security | platform | domains | **platform + security** |
| Exception to a guardrail | API Champion | security | platform | architecture | **security** (not the domain) |
| Migrate a domain to a distributed gateway | platform | domain | both | operations | **domain + platform** |

**Principle:** the day-to-day decision (publish) is **pushed to the domain** (autonomy); the decision about **policy** (guardrail, security exception) stays **centralized**, consistent with the model "distributed execution, central policy." RAPID is what keeps "autonomy" from becoming "everyone does whatever they want."

## 6.2 Decision under pressure

**Diagnose the type of pressure before reacting.** Urgency (incident, SLA), Visibility (the board is watching), Reputation (fear of failing), and Politics (**HiPPO**, the highest-paid person's opinion). Each one activates a different bias; the first question is *"what kind of pressure is this?"*.

**Pressure map (impact × exposure):**

| | Low exposure | High exposure |
|---|---|---|
| **High impact** | **Silent crisis:** the single point of failure degrading slowly | **Combat zone:** the central gateway falls and takes journeys down with it |
| **Low impact** | Background noise | Organizational theater (the "color of the button") |

The danger in this case is the **silent crisis**: the single gateway did not scream every day, until it became a combat zone in an incident. Federating is attacking the silent crisis **before** it explodes.

**Under stress, the brain decides worse.** Two extremes: **paralysis** (I want one more data point, one more meeting) and **impulsiveness** (I decide fast to relieve anxiety or to please the HiPPO). A dysregulated PM transmits anxiety to the team; self-regulation is decision-quality management.

**From firefighter to architect.** Strong teams prepare **before** the crisis: a **pre-mortem**, an **incident playbook** (scenarios, communication, decision criterion), and an **incident RACI** (who decides rollback, who communicates), which is RAPID (6.1.1) in its crisis version. Two concrete scenarios:
1. **Incident:** federating reduces pressure **structurally** (end of the single point of failure); while the center existed, the response was postmortem + guardrail, never heroism.
2. **Regulatory:** Open Finance/PIX arrive with a fixed deadline and a fixed design; the response is not to accelerate everything, but to **sequence** (Now/Next/Later) while protecting the mandatory agenda.

**Antidote to panic:** **scale criteria agreed in advance, in cold blood**

## 6.3 Leadership without authority: culture changes through mechanism, not speech

| Mechanism | Leadership function |
|---|---|
| API Champion track + certification | scales knowledge; creates a governance peer in each domain |
| Automated quality gates | takes the "police" role off the human; reduces interpersonal conflict |
| API Score + dashboards | accountability by evidence, not by opinion |
| Showcases of migrated domains | social proof → voluntary adoption |
| Playbooks + living docs | reduces dependence on the center |
| Governance agreements | autonomy with clear rails |

The federation was, at its core, an **organizational-model change**: from central dependence to federated autonomy with governance. The product was the instrument of that change.

> **Generalization layer.** Any horizontal platform is, before anything else, a negotiation between people who want speed and people who want control. The platform leader who only ships technology loses; the one who designs **mechanisms that align incentives** wins. Automated guardrails are the best example: they turn a recurring human conflict ("security blocked us again") into a code rule that nobody has to debate every time.

## 6.4 Communicate to influence (leadership without authority)

**Why before what (Context → Objective → Action → Impact, Tera).** Not "we are going to distribute gateways," but: *"the central gateway is a single point of failure and it blocks digital time-to-market (context); we want to publish in days without losing governance (objective); that is why we federate with API Champions + guardrails (action); the impact is −lead time, the end of the single point of failure, and reuse (impact)."*

**Same message, different languages.** The same initiative changes language by stakeholder:
- **C-level:** digital revenue enabled, risk reduced, cost avoided.
- **Engineering:** reuse, performance, the end of the single-gateway debt.
- **Security/compliance:** policy as code, traceability, guardrails.
- **Operations:** fewer incidents, predictability, SLA.

**Technical respect is the base of influence: a note for the TPM.** With a strong technical background, the risk is deciding architecture alone. The posture that preserves influence is: *"help me understand the technical risk if we do not do this now,"* not *"do it the other way."* Influence is built every day, through consistency.

<script>
  marked.setOptions({mangle:false, headerIds:false, gfm:true});
  const blocks = [...document.querySelectorAll('script[type="text/markdown"]')];
  const content = document.getElementById('content');
  const nav = document.getElementById('nav');
  blocks.forEach((b,i)=>{
    const id = 'doc-'+i;
    const title = b.dataset.title || ('Document '+i);
    const sec = document.createElement('section');
    sec.className='doc'; sec.id=id;
    const div = document.createElement('div');
    div.className='md';
    div.innerHTML = '<span class="pill">'+title+'</span>' + marked.parse(b.textContent.trim());
    sec.appendChild(div); content.appendChild(sec);
    const a = document.createElement('a');
    a.href='#'+id; a.textContent=title; a.dataset.id=id;
    nav.appendChild(a);
  });
  const links=[...nav.querySelectorAll('a')];
  const secs=links.map(a=>document.getElementById(a.dataset.id));
  const obs=new IntersectionObserver((es)=>{
    es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.remove('active'));
      const l=nav.querySelector('a[data-id="'+e.target.id+'"]'); if(l)l.classList.add('active');}});
  },{rootMargin:'-20% 0px -70% 0px'});
  secs.forEach(s=>obs.observe(s));
</script>
